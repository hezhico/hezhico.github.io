<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>何志 · 人間修仙</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e0d9c8;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .mist {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at 50% 0%, #1a1a2e 0%, #0a0a0f 70%);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 720px;
      width: 100%;
      padding: 80px 24px 120px;
    }
    .hero {
      text-align: center;
      padding: 60px 0 80px;
      border-bottom: 1px solid rgba(200,180,140,0.15);
      margin-bottom: 60px;
    }
    .hero h1 {
      font-size: 2.4rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      color: #c8b88a;
      text-shadow: 0 0 40px rgba(200,184,138,0.3);
      margin-bottom: 16px;
    }
    .hero p {
      font-size: 0.85rem;
      color: rgba(200,184,138,0.5);
      letter-spacing: 0.2em;
    }
    .posts { list-style: none; }
    .post-item {
      padding: 32px 0;
      border-bottom: 1px solid rgba(200,180,140,0.1);
      cursor: pointer;
      transition: all 0.3s;
    }
    .post-item:hover { padding-left: 16px; border-color: rgba(200,180,140,0.3); }
    .post-item:hover .post-title { color: #e8d4a0; }
    .post-date {
      font-size: 0.75rem;
      color: rgba(200,184,138,0.4);
      letter-spacing: 0.15em;
      margin-bottom: 8px;
    }
    .post-title {
      font-size: 1.2rem;
      color: #c8b88a;
      margin-bottom: 10px;
      transition: color 0.3s;
    }
    .post-excerpt {
      font-size: 0.88rem;
      color: rgba(200,184,138,0.55);
      line-height: 1.8;
    }
    .tag {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 10px;
      border: 1px solid rgba(200,180,140,0.3);
      border-radius: 2px;
      color: rgba(200,184,138,0.5);
      margin-bottom: 8px;
      letter-spacing: 0.1em;
    }
    .footer {
      text-align: center;
      padding-top: 60px;
      font-size: 0.75rem;
      color: rgba(200,184,138,0.3);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="mist"></div>
  <div class="container">
    <div class="hero">
      <h1>人間修仙</h1>
      <p>劫起劫落，皆是修行 &nbsp;/&nbsp; 何志</p>
    </div>
    <ul class="posts" id="posts"></ul>
    <div class="footer">
      © 2024–2026 何志 · 博客托管于 GitHub Pages
    </div>
  </div>
  <script>
    fetch('data/posts.json').then(r=>r.json()).then(posts=>{
      const ul = document.getElementById('posts');
      posts.forEach(p=>{
        const li = document.createElement('li');
        li.className='post-item';
        li.onclick=()=>location.href='posts/'+p.slug+'.html';
        li.innerHTML=`<div class="post-date">${p.date}</div><span class="tag">${p.tag}</span><div class="post-title">${p.title}</div><div class="post-excerpt">${p.excerpt}</div>`;
        ul.appendChild(li);
      });
    });
  </script>
</body>
</html>
