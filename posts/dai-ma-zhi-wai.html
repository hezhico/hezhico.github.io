    <h1>代码之外</h1>
    <div class="content">键盘敲了十年，
我才明白一个道理——

代码写得好，不如需求改得少。
文档写得细，不如上线没人找。

曾经以为，
技术是通往自由的钥匙。
后来发现，
技术只是另一种加班的形式。

产品说：这个需求很简单。
测试说：这个 bug 不难复现。
运维说：服务器挺稳定的。

然后深夜三点，
你的手机响了。

修仙路上，最大的劫，
不是 bug，不是架构，
是那些永远"最后一版"的需求。

但第二天醒来，
我还是会打开 IDE，
继续敲代码。

因为除了这个，
我也不会干别的。</div>
