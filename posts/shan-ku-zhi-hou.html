    <h1>删库之后</h1>
    <div class="content">以为删库跑路是句玩笑话，
直到你真的手滑了一下。

那一秒，
空气是静止的，
心跳是漏拍的，
手速是跟不上的。

还好，有备份。
还好，服务器跑得快。
还好，只跑了十分钟。

但从那以后，
每次敲 rm -rf，
我都要深呼吸三次，
然后盯着屏幕问自己：
"这真的是你要删的吗？"

程序员三大错觉：
1. 这行代码没问题
2. 备份一定成功
3. 这次不会出事

修仙路上，最高的境界不是飞升，
而是删库之后，还能气定神闲地说一句：
"没事，我早迁移到云上了。"</div>
