    <h1>深夜三点</h1>
    <div class="content">凌晨三点，
群里弹出一条消息：
"在线吗？线上出问题了。"

你看了一眼熟睡的家人，
默默打开电脑。

登录服务器，
日志刷了一屏又一屏，
报错信息比你的人生规划还模糊。

你安慰自己：
这是最后一位用户了。
修完就睡。

然后你发现，
这不是最后一位用户，
这是第一批。

天亮了，
bug 修好了，
你也修仙成功了——熬了一整夜，
头发又少了几根。

唯一值得庆幸的是：
还好不是删库跑路。</div>
