  <div class="container">
    <a class="back" href="/">← 回首页</a>
    <div class="date">2026-05-14</div>
    <h1>我在人间修仙</h1>
    <div class="content">世人皆知996，我却日日渡劫忙。

产品一改需求，bug从天而降；
代码写完上线，服务器原地升天。

键盘敲得冒烟，文档写到眼酸，
一行注释没有，代码还能跑通。

这便是程序员的劫——
不是飞升，是秃顶。

但转念一想，
能在乱世写代码，已是一种福报。
能用键盘改变世界，何必在意发量。

修仙之人，不拘小节。
渡劫失败？那就再来一轮。</div>
